# nginx.conf — Reverse-proxy перед ботом с защитой от атак
# Файл монтируется в контейнер: /etc/nginx/conf.d/default.conf

# ── Зоны rate-limit ────────────────────────────────────────────────────────
# general: 15 req/s на IP (burst до 40 без задержки)
limit_req_zone  $binary_remote_addr zone=general:20m  rate=15r/s;
# login: 5 попыток в минуту (жёсткий лимит брутфорса)
limit_req_zone  $binary_remote_addr zone=login:5m     rate=5r/m;
# api: 20 req/s — API-вызовы дашборда
limit_req_zone  $binary_remote_addr zone=api:20m      rate=20r/s;

# ── Лимит одновременных соединений ────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=perip:10m;

# ── Скрыть версию nginx ───────────────────────────────────────────────────
server_tokens off;

server {
    listen 80;
    server_name _;

    # ── Глобальные таймауты ───────────────────────────────────────────────
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # ── Размер запроса (защита от upload-бомб) ────────────────────────────
    client_max_body_size  4m;

    # ── Лимит соединений с одного IP ─────────────────────────────────────
    limit_conn perip 30;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # ── Блокируем сканеры по User-Agent ──────────────────────────────────
    if ($http_user_agent ~* "(masscan|nmap|nikto|sqlmap|zgrab|zmap|dirbuster|gobuster|wfuzz|nuclei|hydra|metasploit|burpsuite|acunetix|openvas|subfinder|amass|shodan)") {
        return 403;
    }
    # Пустой UA — почти всегда сканер
    if ($http_user_agent = "") {
        return 403;
    }

    # ── Блокируем типичные цели атак (WordPress, PHP, git и т.д.) ─────────
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|svn|bak|sql|sh|ini|cfg|log|yml|yaml|toml)$ {
        return 404;
    }
    location ~ ^/(wp-login|wp-admin|xmlrpc|phpmyadmin|admin\.php|\.git|\.env|\.aws|\.htaccess|backup|server-status|actuator) {
        return 404;
    }
    location ~ ^/cgi-bin/ {
        return 404;
    }

    # ── /login — строгий rate-limit (брутфорс) ────────────────────────────
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bot:3000;
        include /etc/nginx/proxy_params.conf;
    }

    # ── WebSocket (socket.io) — нужен upgrade ────────────────────────────
    location /socket.io/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params.conf;
    }

    # ── /api/* — умеренный лимит ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://bot:3000;
        include /etc/nginx/proxy_params.conf;
    }

    # ── /static/* — щедрый лимит (JS/CSS файлы) ──────────────────────────
    location /static/ {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://bot:3000;
        proxy_cache_valid 200 1h;
        include /etc/nginx/proxy_params.conf;
    }

    # ── /health — без лимита (для healthcheck) ────────────────────────────
    location = /health {
        proxy_pass http://bot:3000;
        include /etc/nginx/proxy_params.conf;
        access_log off;
    }

    # ── Всё остальное ─────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://bot:3000;
        include /etc/nginx/proxy_params.conf;
    }

    # ── Страница 429 (custom) ─────────────────────────────────────────────
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"error":"Too Many Requests","retry_after":60}';
        default_type application/json;
    }
}
