# nginx.conf — Reverse-proxy перед ботом с защитой от атак
# Файл монтируется в контейнер: /etc/nginx/conf.d/default.conf

# ── Зоны rate-limit ────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=general:20m  rate=15r/s;
limit_req_zone  $binary_remote_addr zone=login:5m     rate=5r/m;
limit_req_zone  $binary_remote_addr zone=api:20m      rate=20r/s;

# ── Лимит одновременных соединений ────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=perip:10m;

# ── Скрыть версию nginx ───────────────────────────────────────────────────
server_tokens off;

server {
    listen 80;
    server_name _;

    # ── Заблокированные IP (атаки/сканеры) ──────────────────────────────────
    deny 78.17.234.12;
    deny 185.148.1.237;

    # ── Таймауты ──────────────────────────────────────────────────────────
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # ── Лимит размера запроса ─────────────────────────────────────────────
    client_max_body_size  4m;

    # ── Лимит соединений с одного IP ─────────────────────────────────────
    limit_conn perip 30;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

    # ── Блокируем сканеры по User-Agent ──────────────────────────────────
    if ($http_user_agent ~* "(masscan|nmap|nikto|sqlmap|zgrab|zmap|dirbuster|gobuster|wfuzz|nuclei|hydra|metasploit|burpsuite|acunetix|openvas|subfinder|amass|shodan)") {
        return 403;
    }
    if ($http_user_agent = "") {
        return 403;
    }

    # ── Блокируем типичные цели атак ──────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|svn|bak|sql|sh|ini|cfg|log|yml|yaml|toml)$ {
        return 404;
    }
    location ~ ^/(wp-login|wp-admin|xmlrpc|phpmyadmin|admin\.php|\.git|\.env|\.aws|\.htaccess|backup|server-status|actuator) {
        return 404;
    }
    location ~ ^/cgi-bin/ {
        return 404;
    }

    # ── /login — строгий rate-limit ───────────────────────────────────────
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bot:3000;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     60s;
        include /etc/nginx/proxy_params.conf;
    }

    # ── WebSocket (socket.io) ─────────────────────────────────────────────
    location /socket.io/ {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://bot:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout  10s;
        proxy_send_timeout     300s;
        proxy_read_timeout    3600s;
        include /etc/nginx/proxy_params.conf;
    }

    # ── /api/* ────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://bot:3000;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout    120s;
        include /etc/nginx/proxy_params.conf;
    }

    # ── /static/* ─────────────────────────────────────────────────────────
    location /static/ {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://bot:3000;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        include /etc/nginx/proxy_params.conf;
    }

    # ── /health — без лимита ──────────────────────────────────────────────
    location = /health {
        proxy_pass http://bot:3000;
        proxy_connect_timeout  5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
        include /etc/nginx/proxy_params.conf;
        access_log off;
    }

    # ── Всё остальное ─────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://bot:3000;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout    120s;
        include /etc/nginx/proxy_params.conf;
    }
}
