version: "3.9"

services:
  # ── nginx reverse-proxy: rate-limit, DDoS, scanner-block ──────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx_proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Локальная PostgreSQL-база ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Торговый бот (порт НЕ выставляем наружу — только nginx) ───────────
  # ВАРИАНТ 1: Локальная сборка (fallback — используется сейчас)
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - bot_data:/app/data
    env_file:
      - .env
    labels:
      # Watchtower будет следить за обновлениями, когда перейдём на GHCR
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ВАРИАНТ 2: GHCR-образ (раскомментируй, когда образ будет в GHCR)
  # bot:
  #   image: ghcr.io/alexkkkkk/grinch-gram:latest
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   expose:
  #     - "3000"
  #   volumes:
  #     - bot_data:/app/data
  #   env_file:
  #     - .env
  #   labels:
  #     com.centurylinklabs.watchtower.enable: "true"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

volumes:
  bot_data:
  postgres_data:
