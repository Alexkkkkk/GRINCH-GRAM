name: grinch-gram

services:
  grinch-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grinch-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - USE_TESTNET=${USE_TESTNET:-true}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO:-Alexkkkkk/GRINCH-GRAM}
      - REPORT_ERRORS=${REPORT_ERRORS:-true}
      - GRID_SYMBOL=${GRID_SYMBOL:-AUDIOUSDT}
      - GRID_COUNT=${GRID_COUNT:-40}
      - TOTAL_INVESTMENT=${TOTAL_INVESTMENT:-1000}
      - SECRET_KEY=${SECRET_KEY:-grinch-grid-secret}
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - bot-data:/app/data
    networks:
      - grinch-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grinch-nginx:
    image: nginx:alpine
    container_name: grinch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./grid-bot/static:/usr/share/nginx/html/static:ro
      - ./grid-bot/templates:/usr/share/nginx/html/templates:ro
      - ./grid-bot/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      grinch-bot:
        condition: service_healthy
    networks:
      - grinch-net

  grinch-watchtower:
    image: containrrr/watchtower:latest
    container_name: grinch-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
    command: --interval 300 grinch-bot grinch-nginx
    networks:
      - grinch-net

volumes:
  bot-data:
    name: grinch-bot-data

networks:
  grinch-net:
    name: grinch-net
    driver: bridge
