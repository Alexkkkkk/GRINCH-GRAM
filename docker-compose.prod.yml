version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: grinch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx_proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      bot:
        condition: service_healthy
    networks:
      - grinch-net

  db:
    image: postgres:16-alpine
    container_name: grinch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - grinch-net

  bot:
    image: ghcr.io/alexkkkkk/grinch-gram:latest
    container_name: grinch-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - bot_data:/app/data
      - ./backups:/app/backups
      - bot_logs:/app/logs
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - grinch-net

  watchtower:
    image: containrrr/watchtower
    container_name: grinch-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 300 --label-enable
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - grinch-net

volumes:
  bot_data:
  postgres_data:
  bot_logs:

networks:
  grinch-net:
    driver: bridge
