version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "Alexkkkkk"
    labels:
      - "dependencies"
      - "security"
    groups:
      python-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "pytoniq*"
          - "dedust"
          - "ccxt"
          - "cryptography"
    allow:
      - dependency-name: "ccxt"
      - dependency-name: "cryptography"
      - dependency-name: "pytoniq*"
      - dependency-name: "requests"
      - dependency-name: "aiohttp"
    commit-message:
      prefix: "deps"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "dependencies"
    groups:
      docker-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
