name: 👑 AI Supreme Agent — Master Control

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      focus:
        description: "Focus area"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - security
          - performance
          - architecture

permissions:
  contents: read
  issues: write

jobs:
  supreme-analysis:
    name: 👑 Supreme Intelligence Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install tools
        run: |
          pip install ruff bandit radon vulture

      - name: 🔬 Full project analysis
        run: |
          echo "# Supreme Agent Analysis" > supreme-report.md
          echo "## Complexity" >> supreme-report.md
          radon cc . -s -a >> supreme-report.md 2>/dev/null || true
          echo "" >> supreme-report.md
          echo "## Maintainability" >> supreme-report.md
          radon mi . -s >> supreme-report.md 2>/dev/null || true
          echo "" >> supreme-report.md
          echo "## Security" >> supreme-report.md
          bandit -r . -ll -iii -f txt >> supreme-report.md 2>/dev/null || true

      - name: 🧠 Supreme AI Analysis (Groq)
        if: env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FOCUS: ${{ github.event.inputs.focus || 'full' }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, json

          try:
              with open("supreme-report.md", encoding="utf-8") as f:
                  data = f.read()[:4000]
          except Exception:
              data = "N/A"

          focus = os.environ.get("FOCUS", "full")

          prompt = (
              f"You are the Supreme AI Architect of GRINCH-GRAM, a production crypto trading bot. "
              f"Conduct a {focus.upper()} analysis based on:\n\n{data}\n\n"
              "Provide strategic recommendations for:\n"
              "1. Architecture evolution (next 3 months)\n"
              "2. Technical debt prioritization\n"
              "3. Performance optimization roadmap\n"
              "4. Security hardening priorities\n"
              "5. Team/development process improvements\n"
              "Be visionary but actionable."
          )

          payload = {
              "model": "llama-3.1-70b-versatile",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.3,
              "max_tokens": 4000,
          }

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=180) as resp:
                  result = json.loads(resp.read())
                  report = result["choices"][0]["message"]["content"]
              with open("ai-supreme-report.md", "w", encoding="utf-8") as f:
                  f.write("# 👑 AI Supreme Agent Report\n\n")
                  f.write(report)
          except Exception as e:
              with open("ai-supreme-report.md", "w", encoding="utf-8") as f:
                  f.write(f"# 👑 AI Supreme Agent Report\n\nError: {e}")
          PY

      - name: 📤 Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supreme-agent-report
          path: ai-supreme-report.md
          retention-days: 90

      - name: 📝 Create Issue
        if: env.GROQ_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '👑 **AI Supreme Agent** — еженедельный стратегический анализ.\n\n';
            try {
              const report = fs.readFileSync('ai-supreme-report.md', 'utf8');
              body += report.substring(0, 5000) + (report.length > 5000 ? '\n\n...*(truncated)*' : '');
            } catch {
              body += 'Отчёт недоступен. Проверьте артефакт supreme-agent-report.';
            }
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `👑 Supreme Agent Report — ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['ai-generated', 'supreme-agent', 'architecture']
            });
