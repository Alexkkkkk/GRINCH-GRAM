name: 🚀 Production Deploy to VPS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [closed]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
          - restart

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  build:
    name: 🐳 Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          SHA=${GITHUB_SHA::7}
          VERSION="${DATE}-${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify image pushed
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "✅ Image verified in registry"

  deploy:
    name: 🚀 Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy configs to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "docker-compose.prod.yml,nginx.conf,nginx_proxy_params.conf,scripts/"
          target: "/opt/bot/"
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            VERSION="${{ needs.build.outputs.version }}"
            REGISTRY="ghcr.io"
            IMAGE_NAME="${{ github.repository }}"
            
            echo "========================================"
            echo "🚀 Starting deployment v${VERSION}"
            echo "========================================"
            
            cd /opt/bot
            mkdir -p backups logs
            
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            echo "📥 Pulling image ${REGISTRY}/${IMAGE_NAME}:${VERSION}..."
            docker pull "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            
            echo "🏷️ Tagging current as previous..."
            docker tag "${REGISTRY}/${IMAGE_NAME}:latest" "${REGISTRY}/${IMAGE_NAME}:previous" 2>/dev/null || true
            
            docker tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" "${REGISTRY}/${IMAGE_NAME}:latest"
            
            echo "${VERSION}" > /opt/bot/.version
            date -Iseconds >> /opt/bot/.version
            
            echo "🔄 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull always bot
            
            echo "⏳ Health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts"
                exit 1
              fi
              echo "  Attempt $i/30..."
              sleep 2
            done
            
            echo "🧹 Cleaning up..."
            docker system prune -f
            docker image prune -af --filter "until=168h" 2>/dev/null || true
            
            echo "========================================"
            echo "✅ Deployment v${VERSION} successful!"
            echo "========================================"

      - name: Notify Telegram - Success
        if: success() && secrets.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *GRINCH-GRAM Deployed Successfully*
            
            🏷️ Version: `${{ needs.build.outputs.version }}`
            🔗 Commit: `${{ needs.build.outputs.short_sha }}`
            👤 Author: ${{ github.actor }}
            
            [View Deployment](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram - Failure
        if: failure() && secrets.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *GRINCH-GRAM Deploy FAILED*
            
            🔗 Commit: `${{ needs.build.outputs.short_sha }}`
            👤 Author: ${{ github.actor }}
            
            [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  rollback:
    name: ↩️ Rollback to Previous
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    steps:
      - name: Execute rollback
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            cd /opt/bot
            
            echo "🔄 Rolling back to previous version..."
            
            if ! docker image inspect "ghcr.io/${{ github.repository }}:previous" > /dev/null 2>&1; then
              echo "❌ No previous image found!"
              exit 1
            fi
            
            docker tag "ghcr.io/${{ github.repository }}:latest" "ghcr.io/${{ github.repository }}:failed-$(date +%Y%m%d-%H%M%S)" 2>/dev/null || true
            
            docker tag "ghcr.io/${{ github.repository }}:previous" "ghcr.io/${{ github.repository }}:latest"
            docker compose -f docker-compose.prod.yml up -d --no-deps bot
            
            sleep 5
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
            else
              echo "❌ Rollback failed!"
              exit 1
            fi

      - name: Notify Telegram - Rollback
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ↩️ *GRINCH-GRAM Rolled Back*
            
            👤 Triggered by: ${{ github.actor }}
            
            [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  restart:
    name: 🔄 Restart Services
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'restart'
    steps:
      - name: Restart services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            cd /opt/bot
            docker compose -f docker-compose.prod.yml restart
            echo "✅ Services restarted"
