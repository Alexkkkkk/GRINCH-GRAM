name: Phase 5 — Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for deployment"
        required: false
        default: "manual"
        type: string
  repository_dispatch:
    types:
      - vps-error

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Phase 5 (Deploy to VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate deployment secrets
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_SSH_PRIVATE_KEY" ]; then
            echo "::error::VPS_SSH_KEY is not configured"
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "::error::VPS_HOST is not configured (should be IP or domain)"
            exit 1
          fi

      - name: Load VPS SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy main to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          ssh             -o BatchMode=yes             -o StrictHostKeyChecking=yes             "$VPS_USER@$VPS_HOST"             'set -e
             cd /opt/bot
             export GIT_TERMINAL_PROMPT=0
             git pull origin main
             COMPOSE="docker compose"
             if command -v docker-compose >/dev/null 2>&1; then COMPOSE="docker-compose"; fi
             $COMPOSE up -d --build
             sleep 5
             $COMPOSE ps
             $COMPOSE logs --tail 50'

      - name: Health check after deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --max-time 10 "http://$VPS_HOST/health"; then
              echo "✅ VPS health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::VPS health check failed after deploy"
          exit 1

      - name: Record dispatch context
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Deployment triggered by repository_dispatch"
          echo "severity=${{ github.event.client_payload.severity || 'unknown' }}"
          echo "service=${{ github.event.client_payload.service || 'unknown' }}"
