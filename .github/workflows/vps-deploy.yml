name: 🚀 Production Deploy to VPS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [closed]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
          - restart

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────
  # PHASE 0: VALIDATE SECRETS & VPS CONNECTIVITY
  # ───────────────────────────────────────────────────────────────
  validate:
    name: 🔐 Validate Secrets & VPS
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      secrets_ok: ${{ steps.check.outputs.secrets_ok }}
      vps_reachable: ${{ steps.ping.outputs.vps_reachable }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          MISSING=""
          if [ -z "${{ secrets.VPS_HOST }}" ]; then MISSING="$MISSING VPS_HOST"; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then MISSING="$MISSING VPS_USER"; fi
          if [ -z "${{ secrets.VPS_PASSWORD }}" ]; then MISSING="$MISSING VPS_PASSWORD"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING"
            echo "secrets_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "✅ All required secrets present"
          echo "secrets_ok=true" >> "$GITHUB_OUTPUT"

      - name: Check VPS connectivity
        id: ping
        run: |
          if ping -c 1 -W 5 "${{ secrets.VPS_HOST }}" > /dev/null 2>&1; then
            echo "✅ VPS is reachable"
            echo "vps_reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ VPS ping failed (will still attempt deploy)"
            echo "vps_reachable=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────────────────────────
  # PHASE 1: BUILD & PUSH DOCKER IMAGE TO GHCR
  # ───────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push to GHCR
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.validate.outputs.secrets_ok == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate version
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          SHA=${GITHUB_SHA::7}
          VERSION="${DATE}-${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_tag=${REGISTRY}/${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,src=/tmp/.buildx-cache
          cache-to: type=gha,dest=/tmp/.buildx-cache-new,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify image pushed
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "✅ Image verified: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

  # ───────────────────────────────────────────────────────────────
  # PHASE 2: DEPLOY TO VPS
  # ───────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      needs.validate.outputs.secrets_ok == 'true' && (
        github.event_name == 'push' || 
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || 
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
      )
    env:
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy configs to VPS (docker-compose)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "docker-compose.prod.yml"
          target: "/opt/bot/"
          overwrite: true

      - name: Copy configs to VPS (nginx)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "nginx.conf,nginx_proxy_params.conf"
          target: "/opt/bot/"
          overwrite: true

      - name: Copy configs to VPS (scripts)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          source: "scripts/*"
          target: "/opt/bot/scripts/"
          overwrite: true
          strip_components: 1

      - name: Deploy on VPS
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          timeout: 120s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            VERSION="${{ needs.build.outputs.version }}"
            REGISTRY="ghcr.io"
            IMAGE_NAME="${{ github.repository }}"
            
            echo "========================================"
            echo "🚀 Starting deployment v${VERSION}"
            echo "========================================"
            
            cd /opt/bot
            mkdir -p backups logs nginx/ssl
            
            # Save current version for potential rollback
            CURRENT_VERSION=$(cat .version 2>/dev/null | head -1 || echo "unknown")
            echo "📋 Current version on VPS: ${CURRENT_VERSION}"
            
            # Login to GHCR (use GHCR_PAT if available for long-term access)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "🔐 Logging into GHCR with PAT..."
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            else
              echo "🔐 Logging into GHCR with GITHUB_TOKEN..."
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            
            # Pull new image
            echo "📥 Pulling image ${REGISTRY}/${IMAGE_NAME}:${VERSION}..."
            docker pull "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            
            # Tag current as previous for rollback
            echo "🏷️ Tagging current as previous..."
            docker tag "${REGISTRY}/${IMAGE_NAME}:latest" "${REGISTRY}/${IMAGE_NAME}:previous" 2>/dev/null || true
            
            # Tag new as latest
            docker tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" "${REGISTRY}/${IMAGE_NAME}:latest"
            
            # Save version info
            echo "${VERSION}" > /opt/bot/.version
            echo "$(date -Iseconds)" >> /opt/bot/.version
            
            # Deploy with zero downtime
            echo "🔄 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d --no-deps --pull always bot
            
            # Health check with retry
            echo "⏳ Health check (max 60s)..."
            HEALTH_OK=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ Health check passed on attempt $i!"
                HEALTH_OK=true
                break
              fi
              echo "  Attempt $i/30..."
              sleep 2
            done
            
            if [ "$HEALTH_OK" != "true" ]; then
              echo "❌ Health check FAILED after 30 attempts"
              echo "🔄 Auto-rolling back to previous version..."
              
              if docker image inspect "${REGISTRY}/${IMAGE_NAME}:previous" > /dev/null 2>&1; then
                docker tag "${REGISTRY}/${IMAGE_NAME}:previous" "${REGISTRY}/${IMAGE_NAME}:latest"
                docker compose -f docker-compose.prod.yml up -d --no-deps bot
                sleep 5
                if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                  echo "✅ Rollback successful! Previous version is running."
                  echo "rollback_performed=true" >> "$GITHUB_ENV"
                else
                  echo "❌ Rollback also failed! Manual intervention required."
                  exit 1
                fi
              else
                echo "❌ No previous image to rollback to!"
                exit 1
              fi
            fi
            
            # Cleanup (preserve previous and failed tags)
            echo "🧹 Cleaning up old images..."
            docker system prune -f
            # Remove images older than 7 days, but keep previous, latest, and failed tags
            docker image prune -af --filter "until=168h" --filter "label!=${REGISTRY}/${IMAGE_NAME}:previous" 2>/dev/null || true
            
            echo "========================================"
            echo "✅ Deployment v${VERSION} successful!"
            echo "========================================"

      - name: Notify Telegram - Success
        if: success() && env.HAS_TELEGRAM == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ✅ *GRINCH-GRAM Deployed Successfully*
            
            🏷️ Version: `${{ needs.build.outputs.version }}`
            🔗 Commit: `${{ needs.build.outputs.short_sha }}`
            👤 Author: ${{ github.actor }}
            ⏱️ Duration: ${{ job.status }}
            
            [View Deployment](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram - Failure
        if: failure() && env.HAS_TELEGRAM == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ❌ *GRINCH-GRAM Deploy FAILED*
            
            🔗 Commit: `${{ needs.build.outputs.short_sha }}`
            👤 Author: ${{ github.actor }}
            
            [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ───────────────────────────────────────────────────────────────
  # PHASE 3: ROLLBACK (Manual)
  # ───────────────────────────────────────────────────────────────
  rollback:
    name: ↩️ Rollback to Previous
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    env:
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - name: Execute rollback
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          timeout: 60s
          command_timeout: 5m
          script_stop: true
          script: |
            set -e
            cd /opt/bot
            
            echo "🔄 Rolling back to previous version..."
            
            if ! docker image inspect "ghcr.io/${{ github.repository }}:previous" > /dev/null 2>&1; then
              echo "❌ No previous image found!"
              exit 1
            fi
            
            # Save failed version
            docker tag "ghcr.io/${{ github.repository }}:latest" "ghcr.io/${{ github.repository }}:failed-$(date +%Y%m%d-%H%M%S)" 2>/dev/null || true
            
            # Rollback
            docker tag "ghcr.io/${{ github.repository }}:previous" "ghcr.io/${{ github.repository }}:latest"
            docker compose -f docker-compose.prod.yml up -d --no-deps bot
            
            sleep 5
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Rollback successful!"
            else
              echo "❌ Rollback failed!"
              exit 1
            fi

      - name: Notify Telegram - Rollback
        if: env.HAS_TELEGRAM == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ↩️ *GRINCH-GRAM Rolled Back*
            
            👤 Triggered by: ${{ github.actor }}
            
            [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ───────────────────────────────────────────────────────────────
  # PHASE 4: RESTART (Manual)
  # ───────────────────────────────────────────────────────────────
  restart:
    name: 🔄 Restart Services
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'restart'
    env:
      HAS_TELEGRAM: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - name: Restart services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          timeout: 30s
          script: |
            cd /opt/bot
            docker compose -f docker-compose.prod.yml restart
            echo "✅ Services restarted"

      - name: Health check after restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          script: |
            sleep 5
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Health check passed after restart"
            else
              echo "❌ Health check failed after restart"
              exit 1
            fi

      - name: Notify Telegram - Restart
        if: env.HAS_TELEGRAM == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🔄 *GRINCH-GRAM Services Restarted*
            
            👤 Triggered by: ${{ github.actor }}
            
            [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
