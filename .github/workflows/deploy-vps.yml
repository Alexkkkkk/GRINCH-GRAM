name: Auto Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH (password)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== GRINCH-GRAM Auto Deploy ==="
            cd ${{ secrets.APP_DIR || '/var/www/grinch-gram' }}

            echo "[1/3] Pulling latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/3] Verifying CSS grid fixes..."
            if grep -q 'minmax(240px, 280px) 1fr' static/css/style.css; then
              echo "  OK: .main-grid-v2 minmax() applied"
            fi
            if grep -q 'ai-pred-grid' static/css/style.css; then
              echo "  OK: .ai-pred-grid adaptive found"
            fi
            if grep -q 'bm-momentum-stats' static/css/style.css; then
              echo "  OK: .bm-momentum-stats adaptive found"
            fi

            echo "[3/3] Restarting service..."
            if systemctl is-active --quiet ${{ secrets.SERVICE_NAME || 'grinch-gram' }} 2>/dev/null; then
              sudo systemctl restart ${{ secrets.SERVICE_NAME || 'grinch-gram' }}
              echo "  OK: systemd restarted"
            elif command -v pm2 &>/dev/null; then
              pm2 restart ${{ secrets.PM2_NAME || 'grinch-gram' }} || pm2 restart all
              echo "  OK: pm2 restarted"
            elif [ -f docker-compose.yml ]; then
              docker compose restart
              echo "  OK: docker restarted"
            else
              echo "  WARN: no service manager found, restart manually"
            fi

            echo "=== Deploy complete ==="
