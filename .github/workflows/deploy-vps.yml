name: Auto Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 30s
          command_timeout: 5m
          debug: true
          script: |
            echo "=== GRINCH-GRAM Auto Deploy ==="
            echo "[0/4] Checking connection..."
            whoami
            hostname
            
            APP_DIR="${{ secrets.APP_DIR || '/var/www/grinch-gram' }}"
            echo "[1/4] App directory: $APP_DIR"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Directory $APP_DIR does not exist!"
              exit 1
            fi
            
            cd "$APP_DIR"
            echo "Current dir: $(pwd)"
            
            echo "[2/4] Pulling latest main..."
            git status
            git fetch origin main || { echo "ERROR: git fetch failed"; exit 1; }
            git reset --hard origin/main || { echo "ERROR: git reset failed"; exit 1; }
            echo "  OK: code updated to $(git rev-parse --short HEAD)"
            
            echo "[3/4] Verifying CSS grid fixes..."
            if grep -q 'minmax(240px, 280px) 1fr' static/css/style.css; then
              echo "  OK: .main-grid-v2 minmax() applied"
            else
              echo "  WARN: .main-grid-v2 minmax() not found"
            fi
            
            if grep -q 'ai-pred-grid' static/css/style.css; then
              echo "  OK: .ai-pred-grid adaptive found"
            fi
            
            if grep -q 'bm-momentum-stats' static/css/style.css; then
              echo "  OK: .bm-momentum-stats adaptive found"
            fi
            
            echo "[4/4] Restarting service..."
            SERVICE="${{ secrets.SERVICE_NAME || 'grinch-gram' }}"
            
            if systemctl list-units --type=service | grep -q "$SERVICE"; then
              echo "Found systemd service: $SERVICE"
              sudo systemctl restart "$SERVICE" && echo "  OK: systemd restarted" || echo "  WARN: systemctl restart failed (maybe needs sudo password?)"
            elif command -v pm2 &>/dev/null; then
              echo "Found pm2"
              pm2 restart "$SERVICE" 2>/dev/null || pm2 restart all
              echo "  OK: pm2 restarted"
            elif [ -f docker-compose.yml ]; then
              echo "Found docker-compose"
              docker compose restart
              echo "  OK: docker restarted"
            else
              echo "  WARN: no service manager found. Services:"
              systemctl list-units --type=service --state=running | head -10
              echo "  Please restart manually."
            fi
            
            echo "=== Deploy complete ==="
