name: QuantumBrain Live Sync — Build, Optimize & Deployon:  push:    branches: [main]  pull_request:    branches: [main]  schedule:    # Авто-синхронизация каждые 15 минут    - cron: '*/15 * * * *'  workflow_dispatch:    inputs:      environment:        description: 'Deploy environment'        required: true        default: 'production'        type: choice        options:          - production          - stagingenv:  NODE_VERSION: '20'  PYTHON_VERSION: '3.11'jobs:  # ═══════════════════════════════════════════════════════════════════  # STAGE 1: Build & Test  # ═══════════════════════════════════════════════════════════════════  build:    runs-on: ubuntu-latest    steps:      - name: Checkout code        uses: actions/checkout@v4        with:          fetch-depth: 0          token: ${{ secrets.GITHUB_TOKEN }}      - name: Setup Node.js        uses: actions/setup-node@v4        with:          node-version: ${{ env.NODE_VERSION }}          cache: 'npm'      - name: Setup Python        uses: actions/setup-python@v5        with:          python-version: ${{ env.PYTHON_VERSION }}      - name: Install dependencies        run: |          pip install -r requirements.txt 2>/dev/null || true          npm ci 2>/dev/null || true      - name: Lint & Syntax Check          run: |          echo '=== Python Syntax Check ==='          python -m py_compile app.py ai_backend.py config.py || exit 1          echo '=== CSS Syntax Check ==='          python -c '          import re          with open('static/css/style.min.css') as f:              css = f.read()          # Check for unmatched braces          open_count = css.count('{')          close_count = css.count('}')          assert open_count == close_count, f'Unmatched braces: {open_count} vs {close_count}'          print(f'CSS OK: {len(css)} bytes, {open_count} blocks')          '          echo '=== JS Syntax Check ==='          node -c static/js/app.js 2>/dev/null || echo 'JS check skipped'      - name: AI Grid Validation        run: |          python -c '          import re          with open('static/css/style.min.css') as f:              css = f.read()          checks = [              ('main-grid minmax', 'minmax(240px, 270px) 1fr minmax(260px, 300px)' in css),              ('main-grid-v2 minmax', 'minmax(280px, 340px) 1fr' in css),              ('ai-pred-grid adaptive', 'ai-pred-grid' in css and 'repeat(2, 1fr)' in css),              ('bm-momentum-stats adaptive', 'bm-momentum-stats' in css and 'repeat(2, 1fr)' in css),              ('mkt-hero-row mobile', 'mkt-hero-row' in css and '1fr !important' in css),          ]          all_ok = all(c[1] for c in checks)          for name, ok in checks:              print(f'  {'OK' if ok else 'FAIL'}: {name}')          assert all_ok, 'Grid validation failed!'          print('All grid checks passed!')          '      - name: Upload build artifacts        uses: actions/upload-artifact@v4        with:          name: build-files          path: |            static/css/style.min.css            static/js/ai-*.js            static/manifest.json            templates/index.html            ai_backend.py            app.py          retention-days: 7  # ═══════════════════════════════════════════════════════════════════  # STAGE 2: Auto-Optimize (CSS/JS minification, image optimization)  # ═══════════════════════════════════════════════════════════════════  optimize:    needs: build    runs-on: ubuntu-latest    steps:      - name: Checkout code        uses: actions/checkout@v4      - name: Setup Node.js        uses: actions/setup-node@v4        with:          node-version: ${{ env.NODE_VERSION }}      - name: Install optimization tools        run: npm install -g cssnano-cli terser svgo      - name: Optimize CSS (if not minified)        run: |          if [ -f static/css/style.css ] && [ ! -f static/css/style.min.css ]; then            npx cssnano static/css/style.css static/css/style.min.css --safe            echo 'CSS minified'          fi      - name: Optimize JS        run: |          for f in static/js/ai-*.js; do            if [ -f '$f' ]; then              min='${f%.js}.min.js'              npx terser '$f' -o '$min' --compress --mangle              echo 'Minified: $f -> $min'            fi          done 2>/dev/null || true      - name: Check file sizes        run: |          echo '=== File Size Report ==='          du -h static/css/style*.css 2>/dev/null || true          du -h static/js/ai-*.js 2>/dev/null || true          du -h static/js/*.js 2>/dev/null | head -5 || true  # ═══════════════════════════════════════════════════════════════════  # STAGE 3: Deploy to VPS  # ═══════════════════════════════════════════════════════════════════  deploy:    needs: [build, optimize]    runs-on: ubuntu-latest    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'    steps:      - name: Download build artifacts        uses: actions/download-artifact@v4        with:          name: build-files          path: ./build      - name: Deploy to VPS via SSH        uses: appleboy/ssh-action@v1.2.0        with:          host: ${{ secrets.VPS_HOST }}          username: ${{ secrets.VPS_USER }}          password: ${{ secrets.VPS_PASSWORD }}          port: ${{ secrets.VPS_PORT || 22 }}          timeout: 30s          command_timeout: 10m          debug: true          script: |            set -e            APP_DIR='${{ secrets.APP_DIR || '/var/www/grinch-gram' }}'            SERVICE_NAME='${{ secrets.SERVICE_NAME || 'grinch-gram' }}'            echo '╔══════════════════════════════════════════════════════════════╗'            echo '║     QuantumBrain Live Sync — Deploy Started                  ║'            echo '╚══════════════════════════════════════════════════════════════╝'            echo '[1/6] Checking environment...'            whoami            hostname            echo 'Timestamp: '$(date -Iseconds)            if [ ! -d '$APP_DIR' ]; then              echo 'ERROR: Directory $APP_DIR does not exist!'              exit 1            fi            cd '$APP_DIR'            echo 'Current commit: '$(git rev-parse --short HEAD)            echo '[2/6] Stashing local changes (if any)...'            git stash || true            echo '[3/6] Pulling latest main...'            git fetch origin main            git reset --hard origin/main            NEW_COMMIT=$(git rev-parse --short HEAD)            echo 'New commit: '$NEW_COMMIT            echo '[4/6] Verifying AI features...'            # Check CSS grid fixes            if grep -q 'minmax(240px, 280px) 1fr' static/css/style.min.css; then              echo '  OK: .main-grid-v2 minmax() applied'            else              echo '  WARN: .main-grid-v2 minmax() not found'            fi            if grep -q 'ai-pred-grid' static/css/style.min.css; then              echo '  OK: .ai-pred-grid adaptive found'            fi            if grep -q 'bm-momentum-stats' static/css/style.min.css; then              echo '  OK: .bm-momentum-stats adaptive found'            fi            # Check AI backend            if [ -f ai_backend.py ]; then              echo '  OK: ai_backend.py exists'            else              echo '  WARN: ai_backend.py missing'            fi            # Check AI frontend            for f in ai-sw.js ai-perf.js ai-prefetch.js; do              if [ -f static/js/$f ]; then                echo '  OK: static/js/'$f' exists'              else                echo '  WARN: static/js/'$f' missing'              fi            done            echo '[5/6] Installing Python dependencies...'            pip install -q -r requirements.txt 2>/dev/null || pip install -q flask flask-socketio numpy || true            echo '[6/6] Restarting service...'            if systemctl list-units --type=service | grep -q '$SERVICE_NAME'; then              sudo systemctl restart '$SERVICE_NAME'              echo '  OK: systemd service '$SERVICE_NAME' restarted'              sleep 2              if systemctl is-active --quiet '$SERVICE_NAME'; then                echo '  OK: Service is RUNNING'              else                echo '  ERROR: Service failed to start!'                sudo systemctl status '$SERVICE_NAME' --no-pager                exit 1              fi            elif command -v pm2 &>/dev/null; then              pm2 restart '$SERVICE_NAME' 2>/dev/null || pm2 restart all              echo '  OK: pm2 restarted'            elif [ -f docker-compose.yml ]; then              docker compose restart              echo '  OK: docker restarted'            else              echo '  WARN: No service manager found. Manual restart required.'            fi            echo ''            echo '╔══════════════════════════════════════════════════════════════╗'            echo '║     Deploy Complete!                                         ║'            echo '║     Commit: '$NEW_COMMIT'                                    ║'            echo '║     Time: '$(date -Iseconds)'                                ║'            echo '╚══════════════════════════════════════════════════════════════╝'      - name: Health Check        run: |          echo 'Waiting for service to start...'          sleep 5          echo '=== Health Check ==='          curl -sf http://${{ secrets.VPS_HOST }}:${{ secrets.APP_PORT || 80 }}/health && echo 'HEALTHY' || echo 'Health check skipped'  # ═══════════════════════════════════════════════════════════════════  # STAGE 4: Post-Deploy Verification  # ═══════════════════════════════════════════════════════════════════  verify:    needs: deploy    runs-on: ubuntu-latest    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'    steps:      - name: Verify AI Endpoints        run: |          HOST='http://${{ secrets.VPS_HOST }}:${{ secrets.APP_PORT || 80 }}'          echo '=== AI Endpoint Verification ==='          # Check AI status          curl -sf '$HOST/api/ai/status' | python3 -m json.tool 2>/dev/null || echo 'AI status check failed'          # Check AI analytics          curl -sf '$HOST/api/ai/analytics' | python3 -m json.tool 2>/dev/null || echo 'AI analytics check failed'          echo 'Verification complete'      - name: Notify Success        if: success()        run: |          echo 'QuantumBrain Live Sync completed successfully!'          echo 'All systems operational.'      - name: Notify Failure        if: failure()        run: |          echo 'QuantumBrain Live Sync FAILED!'          echo 'Check logs above for details.'