name: AI README proposal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions: read-all

concurrency:
  group: ai-readme
  cancel-in-progress: true

jobs:
  generate-readme:
    name: Generate reviewable README proposal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate README with AI when configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY is not configured; skipping optional AI proposal."
            exit 0
          fi
          python - <<'PY'
          import glob
          import json
          import os
          import urllib.error
          import urllib.request

          files = []
          for pattern in ("*.py", "Dockerfile", "requirements.txt", "config.py"):
              for path in glob.glob(pattern):
                  try:
                      with open(path, encoding="utf-8") as handle:
                          files.append(f"=== {path} ===\n{handle.read()[:2500]}")
                  except OSError:
                      pass
          if not files:
              raise SystemExit("No project files available for the optional proposal")

          prompt = (
              "Создай технический README.md для GRINCH-GRAM на русском языке. "
              "Не выдумывай возможности: используй только переданный контекст. "
              "Укажи, что автоматические изменения проходят через pull request. "
              "Верни только Markdown.\n\n" + "\n\n".join(files)[:10000]
          )
          payload = {
              "model": "llama-3.1-70b-versatile",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.2,
              "max_tokens": 4000,
          }
          request = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read())
          except urllib.error.HTTPError as error:
              print(f"Optional AI proposal skipped: Groq HTTP {error.code}")
              raise SystemExit(0)
          content = result.get("choices", [{}])[0].get("message", {}).get("content", "")
          if not content.strip():
              raise SystemExit("Optional AI proposal returned no content")
          with open("README.md", "w", encoding="utf-8") as readme:
              readme.write(content.rstrip() + "\n")
          PY

      - name: Open or update a documentation PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ai-readme
          delete-branch: true
          title: "docs: refresh README proposal"
          commit-message: "docs: refresh README proposal"
          body: |
            ## Automated documentation proposal

            This PR was generated by an optional AI job. Review every
            technical claim before merging. No direct write to `main` is used.
          labels: |
            documentation
            automation

      - name: 📊 AI README Generation Summary
        if: always()
        run: |
          echo "# 🤖 AI README Proposal Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "> ⏭️ **Skipped:** GROQ_API_KEY is not configured." >> $GITHUB_STEP_SUMMARY
          else
            echo "> ✅ **Executed:** AI proposal generated and submitted as PR." >> $GITHUB_STEP_SUMMARY
          fi
