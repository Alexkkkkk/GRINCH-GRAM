name: 📝 Generate README

on:
  push:
    branches: [main, master]
    paths:
      - "*.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/generate-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Auto-generate README
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 📊 Collect project stats
        run: |
          python3 - <<'PY'
          import os, json, subprocess

          stats = {
              "python_files": len([f for f in os.listdir(".") if f.endswith(".py")]),
              "total_lines": 0,
              "modules": [],
          }

          for f in sorted(os.listdir(".")):
              if f.endswith(".py") and os.path.isfile(f):
                  with open(f, encoding="utf-8", errors="ignore") as file:
                      lines = len(file.readlines())
                      stats["total_lines"] += lines
                      stats["modules"].append(f"- `{f}` ({lines} lines)")

          with open("project-stats.json", "w") as f:
              json.dump(stats, f, indent=2)

          print(f"Python files: {stats['python_files']}")
          print(f"Total lines: {stats['total_lines']}")
          PY

      - name: 🧠 AI README Generation (Groq)
        if: env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          try:
              with open("project-stats.json", encoding="utf-8") as f:
                  stats = json.load(f)
          except Exception:
              stats = {"python_files": 0, "total_lines": 0, "modules": []}

          # Собираем описания модулей из docstrings
          modules_desc = []
          for f in sorted(os.listdir(".")):
              if f.endswith(".py") and os.path.isfile(f):
                  try:
                      with open(f, encoding="utf-8", errors="ignore") as file:
                          first_lines = file.read(300)
                          if '"''' in first_lines or '"''' in first_lines:
                              desc = first_lines.split('"''')[1] if '"''' in first_lines else first_lines.split("'''")[1]
                              modules_desc.append(f"**{f}**: {desc.strip()[:100]}")
                  except Exception:
                      pass

          prompt = (
              "Generate a professional README.md for a cryptocurrency trading bot called GRINCH-GRAM. "
              "It trades GRINCH/TON on DeDust DEX in the TON ecosystem. "
              "The bot has AI/ML modules, a Flask dashboard, Docker deployment, and Telegram alerts.\n\n"
              f"Stats: {stats['python_files']} Python files, {stats['total_lines']} total lines\n\n"
              f"Key modules:\n" + "\n".join(modules_desc[:15]) + "\n\n"
              "Generate a complete README with:\n"
              "1. Title and badges (CI, Docker, Python 3.11, TON)\n"
              "2. Description and features\n"
              "3. Architecture overview (Mermaid diagram)\n"
              "4. Installation (Docker + manual)\n"
              "5. Configuration (.env variables)\n"
              "6. Trading strategy overview\n"
              "7. AI/ML components description\n"
              "8. Security notes\n"
              "9. License (MIT placeholder)\n"
              "Use Russian language."
          )

          payload = {
              "model": "llama-3.1-70b-versatile",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.3,
              "max_tokens": 4000,
          }

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  result = json.loads(resp.read())
                  readme = result["choices"][0]["message"]["content"]
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(readme)
              print("README generated successfully")
          except Exception as e:
              print(f"README generation failed: {e}")
          PY

      - name: 🚀 Commit README
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs(readme): auto-generated README [skip ci]"
          branch: main
          commit_user_name: "Grinch-Gram Bot"
          commit_user_email: "bot@grinch-gram.local"
          file_pattern: "README.md"
