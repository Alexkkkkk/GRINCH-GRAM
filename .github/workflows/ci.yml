name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install static-analysis tools
        run: python -m pip install --disable-pip-version-check "ruff==0.12.10"

      - name: Compile every Python module
        run: |
          python -m compileall -q \
            -x '(^|/)(\.git|__pycache__|attached_assets|data|backups)(/|$)' \
            .

      - name: Run blocking Ruff checks
        run: |
          ruff check . \
            --select E9,F63,F7,F82 \
            --output-format github

      - name: Run repository smoke checks
        run: python scripts/ci_smoke.py

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: grinch-gram:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        run: |
          set -euo pipefail
          docker run --detach \
            --name grinch-gram-ci \
            --publish 3000:3000 \
            --env PORT=3000 \
            --env LOW_MEMORY_MODE=1 \
            --env DATA_DIR=/tmp/data \
            grinch-gram:ci
          trap 'docker logs grinch-gram-ci || true; docker rm -f grinch-gram-ci || true' EXIT
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Container did not become healthy in time"
          exit 1
