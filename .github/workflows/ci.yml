name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install black flake8 bandit
          black --check . || true
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          files="$(git diff --name-only "$base" HEAD -- '*.py')"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
          else
            echo "No changed Python files to lint"
          fi
          bandit -r . || true
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: grinch-gram:test
