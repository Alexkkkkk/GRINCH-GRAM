name: 👑 GOD-MODE Dependabot Auto-Merge & Governance Agent

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  godmode-automerge-governance:
    name: 🛡️ Autonomous Safety Inspection & Auto-Merge Engine
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: 📥 Fetch Dependabot Intelligence Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: 🔬 Deep Safety & Scope Validation
        id: safety_check
        run: |
          set -euo pipefail
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          ECOSYSTEM="${{ steps.metadata.outputs.package-ecosystem }}"
          
          echo "🔍 [Dependabot Analysis] Ecosystem: $ECOSYSTEM | Update Type: $UPDATE_TYPE"
          
          # Фильтрация: Разрешаем аппрув для патчей, минорок и экшенов CI/CD
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]] || \
             [[ "$UPDATE_TYPE" == "version-update:semver-minor" ]] || \
             [[ "$ECOSYSTEM" == "github-actions" ]] || \
             [[ "$ECOSYSTEM" == "docker" ]]; then
            echo "IS_SAFE=true" >> $GITHUB_ENV
            echo "✅ Изменения признаны безопасными для автоматического слияния."
          else
            echo "IS_SAFE=false" >> $GITHUB_ENV
            echo "⚠️ Обнаружено мажорное обновление. Автоматический слив заблокирован для ручного ревью."
          fi

      - name: 🔑 Auto-Approve Pull Request
        if: env.IS_SAFE == 'true'
        run: |
          for i in {1..3}; do
            gh pr review --approve "$PR_URL" && break || sleep 5
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Queue Smart Auto-Merge (Squash & Auto-Delete Branch)
        if: env.IS_SAFE == 'true'
        run: |
          gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Post Executive Agent Summary to PR
        if: always() && env.IS_SAFE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ecosystem = "${{ steps.metadata.outputs.package-ecosystem }}";
            const updateType = "${{ steps.metadata.outputs.update-type }}";
            const targetBranch = context.payload.pull_request.base.ref;

            const summaryComment = `## 👑 GRINCH-GRAM Dependabot Governance Agent
            
            ### 📊 Результаты проверки безопасности:
            | Параметр | Значение |
            | :--- | :--- |
            | 📦 **Экосистема** | \`${ecosystem}\` |
            | 📈 **Уровень обновления** | \`${updateType}\` |
            | 🎯 **Целевая ветка** | \`${targetBranch}\` |
            | 🛡️ **Вердикт безопасности** | 🟢 Safe Auto-Merge Approved |
            
            ---
            
            ### ⚡ Выполненные действия:
            1. ✅ PR успешно прошел проверку правил безопасности.
            2. 🔑 Выставлено автоматическое одобрение (**Approved**).
            3. 🚀 Активирована очередь слияния (**Auto-Merge** via Squash).
            4. 🧹 Временная ветка будет автоматически удалена сразу после завершения CI.`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.data.find(c => c.body.includes('GRINCH-GRAM Dependabot Governance Agent'));

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summaryComment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summaryComment
              });
            }
