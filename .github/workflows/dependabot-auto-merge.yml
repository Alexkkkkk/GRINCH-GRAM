name: Dependabot safe auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Merge safe Dependabot update
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.12.10"

      - name: Compile Python modules
        run: |
          python -m compileall -q \
            -x '(^|/)(\.git|__pycache__|attached_assets|data|backups)(/|$)' \
            .

      - name: Run exact merge safety lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Read Dependabot update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Allow only patch and minor updates
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "Safe Dependabot update: $UPDATE_TYPE"
              ;;
            *)
              echo "Not eligible for automatic merge: ${UPDATE_TYPE:-unknown}"
              exit 1
              ;;
          esac

      - name: Wait for all required GitHub checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr checks "$PR_NUMBER" --required --watch --interval 15

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
