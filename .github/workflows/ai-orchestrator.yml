name: 🤖 AI Orchestrator — Supreme Intelligence Layer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: "AI Mode"
        required: true
        default: "full-scan"
        type: choice
        options:
          - full-scan
          - bug-hunt
          - code-review
          - docs-update

permissions: read-all

concurrency:
  group: ai-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-context:
    name: 🧠 Context Analysis
    runs-on: ubuntu-latest
    outputs:
      trigger_type: ${{ steps.context.outputs.trigger }}
      changed_files: ${{ steps.context.outputs.files }}
      has_python: ${{ steps.context.outputs.has_python }}
      has_docker: ${{ steps.context.outputs.has_docker }}
      has_workflow: ${{ steps.context.outputs.has_workflow }}
      has_docs: ${{ steps.context.outputs.has_docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analyze Context
        id: context
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "trigger=pr" >> $GITHUB_OUTPUT
            git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          else
            echo "trigger=push" >> $GITHUB_OUTPUT
            git diff --name-only HEAD~1 HEAD > changed_files.txt
          fi

          echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "has_python=$(grep -q '\.py$' changed_files.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_docker=$(grep -q -E 'Dockerfile|docker-compose' changed_files.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_workflow=$(grep -q '\.github/workflows/' changed_files.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_docs=$(grep -q -E '\.md$|README' changed_files.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  ai-code-review:
    name: 👁️ Deep Code Review
    needs: analyze-context
    if: needs.analyze-context.outputs.has_python == 'true'
    uses: ./.github/workflows/ai-code-review.yml
    secrets: inherit

  ai-bug-hunter:
    name: 🐛 Predictive Bug Hunt
    needs: analyze-context
    if: needs.analyze-context.outputs.has_python == 'true'
    uses: ./.github/workflows/ai-bug-hunter.yml
    secrets: inherit

  ai-security-audit:
    name: 🛡️ AI Security Auditor
    needs: analyze-context
    if: needs.analyze-context.outputs.has_python == 'true'
    uses: ./.github/workflows/ai-security-audit.yml
    secrets: inherit

  ai-docs-sync:
    name: 📚 Documentation Sync
    needs: analyze-context
    if: needs.analyze-context.outputs.has_docs == 'true' || needs.analyze-context.outputs.has_python == 'true'
    uses: ./.github/workflows/ai-docs-sync.yml
    secrets: inherit

  ai-summary:
    name: 📊 Executive AI Report
    needs: [ai-code-review, ai-bug-hunter, ai-security-audit, ai-docs-sync]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const jobs = [
              { name: 'Code Review', status: '${{ needs.ai-code-review.result }}' },
              { name: 'Bug Hunter', status: '${{ needs.ai-bug-hunter.result }}' },
              { name: 'Security Audit', status: '${{ needs.ai-security-audit.result }}' },
              { name: 'Docs Sync', status: '${{ needs.ai-docs-sync.result }}' },
            ];

            const emoji = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : '⏭️';
            const hasFailures = jobs.some(j => j.status === 'failure');

            const report = `## 🤖 AI Orchestrator Report

            | AI Agent | Status |
            | :--- | :--- |
            ${jobs.map(j => `| ${j.name} | ${emoji(j.status)} ${j.status} |`).join('\n')}

            ${hasFailures ? '🔴 **Внимание:** Найдены проблемы. Проверьте отдельные AI-отчёты выше.' : '🟢 **Все AI-проверки пройдены.**'}`;

            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.data.find(c => c.body.includes('AI Orchestrator Report'));

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }
