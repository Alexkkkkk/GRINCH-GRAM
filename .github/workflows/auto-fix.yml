name: Automatic safe fixes

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 6"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-fix
  cancel-in-progress: true

jobs:
  fix:
    name: Prepare a reviewable fix PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.12.10"

      - name: Apply safe Ruff fixes only
        run: |
          ruff check . \
            --fix \
            --extend-select E4,E7,E9,F \
            --output-format github
          ruff format .

      - name: Open or update an auto-fix PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/ruff-safe-fixes
          delete-branch: true
          title: "chore: apply safe Ruff fixes"
          commit-message: "chore: apply safe Ruff fixes"
          body: |
            ## Automated safe fixes

            Ruff applied only safe lint fixes and formatting.
            This workflow never pushes directly to `main`.

            Review the diff carefully, especially if it touches trading,
            wallet, blockchain, or background-thread code.
          labels: |
            automation
            code-quality
