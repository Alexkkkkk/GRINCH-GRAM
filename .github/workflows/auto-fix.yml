name: Code check and auto-fix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  quality:
    name: Check and auto-fix Python code
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Для PR проверяем именно head-ветку, чтобы автофикс мог
          # добавить коммит в неё, а не в локальную копию merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff

      - name: Find Python files to check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "origin/$BASE_REF...HEAD" -- '*.py' \
              | while IFS= read -r file; do
                  [[ -f "$file" ]] && printf '%s\n' "$file"
                done > /tmp/python-files.txt
          else
            find . -type f -name '*.py' \
              -not -path './.git/*' \
              -not -path './.cache/*' \
              -not -path './artifacts/*' \
              -print | sort > /tmp/python-files.txt
          fi

          echo "Python files selected:"
          cat /tmp/python-files.txt || true

      - name: Apply safe fixes to pull request
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/python-files.txt ]]; then
            echo "No changed Python files"
            exit 0
          fi

          # Checkout по SHA оставляет detached HEAD. Переключаемся на
          # исходную ветку PR перед автоматическим коммитом.
          git switch -C "$HEAD_REF"
          mapfile -t files < /tmp/python-files.txt
          # I fixes import ordering only; format applies Ruff's formatter.
          ruff check "${files[@]}" --select I --fix
          ruff format "${files[@]}"

      - name: Commit automatic fixes
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No automatic fixes were needed"
            exit 0
          fi

          mapfile -t files < /tmp/python-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style: automatic Ruff fixes"
          git push origin "HEAD:$HEAD_REF"

      - name: Compile Python files
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/python-files.txt ]]; then
            echo "No Python files"
            exit 0
          fi

          mapfile -t files < /tmp/python-files.txt
          python -m compileall -q "${files[@]}"

      - name: Check critical Ruff errors
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/python-files.txt ]]; then
            echo "No Python files"
            exit 0
          fi

          mapfile -t files < /tmp/python-files.txt
          # These rules catch startup-breaking syntax and undefined names.
          ruff check "${files[@]}" --select E9,F63,F7,F82

      - name: Verify formatting in pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/python-files.txt ]]; then
            echo "No Python files"
            exit 0
          fi

          mapfile -t files < /tmp/python-files.txt
          ruff format --check "${files[@]}"
