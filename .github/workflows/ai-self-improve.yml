name: 🔄 AI Self-Improvement

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  self-improve:
    name: 🤖 AI Code Refactoring
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install tools
        run: |
          pip install ruff black isort radon

      - name: 🔬 Analyze code quality
        run: |
          radon cc . -s -a --min=C > complexity-hotspots.txt || true
          ruff check . --output-format=json > ruff-full.json || true

      - name: 🧠 AI Refactoring Suggestions (Groq)
        if: env.GROQ_API_KEY != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          try:
              with open("complexity-hotspots.txt", encoding="utf-8") as f:
                  complexity = f.read()[:2000]
          except Exception:
              complexity = "N/A"

          prompt = (
              "You are a senior Python developer refactoring a crypto trading bot. "
              "Based on the following complexity analysis, suggest specific refactoring:\n\n"
              f"{complexity}\n\n"
              "For each complex function (C grade or higher):\n"
              "1. Suggest extraction into smaller functions\n"
              "2. Recommend design patterns\n"
              "3. Identify duplicated logic\n"
              "4. Suggest type hints and better naming\n"
              "Output as a structured refactoring plan."
          )

          payload = {
              "model": "llama-3.1-70b-versatile",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.2,
              "max_tokens": 3000,
          }

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  result = json.loads(resp.read())
                  report = result["choices"][0]["message"]["content"]
              with open("ai-refactoring-plan.md", "w", encoding="utf-8") as f:
                  f.write("# 🔄 AI Self-Improvement Plan\n\n")
                  f.write(report)
          except Exception as e:
              with open("ai-refactoring-plan.md", "w", encoding="utf-8") as f:
                  f.write(f"# 🔄 AI Self-Improvement Plan\n\nError: {e}")
          PY

      - name: 📤 Upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-refactoring-plan
          path: ai-refactoring-plan.md
          retention-days: 30

      - name: 🚀 Create improvement PR
        if: env.GROQ_API_KEY != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ai/self-improve-${{ github.run_id }}
          delete-branch: true
          title: "🔄 AI Self-Improvement Report"
          commit-message: "docs(refactor): AI refactoring plan [skip ci]"
          body: |
            ## 🤖 AI Self-Improvement Analysis

            Weekly automated code quality review.
            See `ai-refactoring-plan.md` for details.
          labels: |
            ai-generated
            refactoring
            documentation
