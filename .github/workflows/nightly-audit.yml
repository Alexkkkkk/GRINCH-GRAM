name: 🌙 NIGHTLY OVERLORD Security & Vulnerability Audit

on:
  schedule:
    # Автозапуск каждую ночь в 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: nightly-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-security-audit:
    name: 🛡️ Deep Security & Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: ⚡ Cache Pip Packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nightly-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-nightly-

      - name: 📦 Install Security Audit Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔍 Audit Python Dependencies (pip-audit)
        id: pip_audit
        run: |
          echo "🔍 Проверка сторонних библиотек на известные CVE..."
          pip-audit --desc on
        continue-on-error: true

      - name: 🔒 Static Security Code Analysis (Bandit)
        id: bandit
        run: |
          echo "🔒 Сканирование всего Python-кода на уязвимости и утечки ключей..."
          bandit -r . -ll -iii \
            -x .git,__pycache__,attached_assets,data,backups
        continue-on-error: true

      - name: 🐳 Container & Infrastructure Audit (Trivy)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          hide-shortcut-env-vars: 'true'
          output: 'trivy-results.sarif'
          format: 'sarif'
        continue-on-error: true

      - name: 📤 Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: 📊 Executive Visual Summary
        if: always()
        run: |
          PIP_STATUS="${{ steps.pip_audit.outcome }}"
          BANDIT_STATUS="${{ steps.bandit.outcome }}"
          TRIVY_STATUS="${{ steps.trivy.outcome }}"

          pip_emoji=$([ "$PIP_STATUS" == "success" ] && echo "✅" || echo "⚠️")
          bandit_emoji=$([ "$BANDIT_STATUS" == "success" ] && echo "✅" || echo "⚠️")
          trivy_emoji=$([ "$TRIVY_STATUS" == "success" ] && echo "✅" || echo "⚠️")

          echo "# 🌙 NIGHTLY SECURITY AUDIT REPORT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Состояние безопасности проекта:" >> $GITHUB_STEP_SUMMARY
          echo "| Сканер | Назначение | Статус |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${pip_emoji} **pip-audit** | Проверка CVE зависимостей | ${PIP_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| ${bandit_emoji} **Bandit** | Анализ кода Python | ${BANDIT_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| ${trivy_emoji} **Trivy** | Проверка Dockerfile и конфигов | ${TRIVY_STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🤖 **Результаты отправлены во вкладку Security. При статусе \`failure\` проверьте логи соответствующего шага.**" >> $GITHUB_STEP_SUMMARY
