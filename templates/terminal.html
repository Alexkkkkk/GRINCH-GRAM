<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal · GRINCH-GRAM</title>
  <style>
    :root { color-scheme: dark; --bg:#090d12; --panel:#101820; --line:#22303d; --text:#d8e4ee; --muted:#8293a4; --accent:#00e5ff; --ok:#00ff88; --danger:#ff5577; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -20%,#123044 0,#090d12 48%); color:var(--text); font:14px/1.45 system-ui,sans-serif; padding:24px; }
    main { max-width:1000px; margin:auto; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; }
    h1 { font-size:20px; margin:0; letter-spacing:.04em; } h1 span { color:var(--accent); }
    a { color:var(--accent); text-decoration:none; }
    .panel { background:rgba(16,24,32,.92); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 16px 50px #0005; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .command-form { display:flex; gap:8px; margin-bottom:14px; }
    .command-form input { flex:1; min-width:0; background:#080d12; color:var(--text); border:1px solid #2b4658; border-radius:9px; padding:10px 12px; font:13px ui-monospace,monospace; outline:none; }
    .command-form input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #00e5ff18; }
    button { border:1px solid #2b4658; background:#142431; color:var(--text); border-radius:9px; padding:9px 12px; cursor:pointer; }
    button:hover { border-color:var(--accent); color:#fff; } button:disabled { opacity:.55; cursor:wait; }
    pre { min-height:390px; max-height:65vh; overflow:auto; margin:0; padding:16px; border-radius:10px; background:#05080b; border:1px solid #182630; color:#c9f7df; white-space:pre-wrap; word-break:break-word; font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .meta { color:var(--muted); font-size:12px; margin-top:10px; } .warn { color:#ffd166; }
  </style>
</head>
<body>
<main>
  <header><h1><span>›_</span> VPS diagnostics terminal</h1><a href="/">← Панель</a></header>
  <section class="panel">
    <div class="toolbar" id="actions"></div>
    <form id="commandForm" class="command-form"><input id="commandInput" autocomplete="off" placeholder="Введите: pwd, ls -la, df -h, free -h, uptime, ps, git status"><button type="submit">Выполнить</button></form>
    <pre id="output">Выберите безопасную диагностическую команду.</pre>
    <div class="meta"><span class="warn">Доступ только после авторизации.</span> Выполнение ограничено серверным allowlist.</div>
  </section>
</main>
<script>
const csrfToken = {{ csrf_token|tojson }};
const commandForm = document.querySelector('#commandForm'), commandInput = document.querySelector('#commandInput');
const actions = [
  ['health','Health приложения'], ['status','Статус процесса'], ['files','Файлы приложения'],
  ['disk','Диск'], ['memory','Память'], ['logs','Последние логи'], ['git','Git status']
];
const box = document.querySelector('#actions'), out = document.querySelector('#output');
actions.forEach(([key,label]) => { const b=document.createElement('button'); b.textContent=label; b.onclick=()=>run(key,b); box.appendChild(b); });
async commandForm.addEventListener('submit', e => { e.preventDefault(); const value=commandInput.value.trim(); if (value) { run(value, commandForm.querySelector('button')); } });
function run(command, button) {
  document.querySelectorAll('button').forEach(x=>x.disabled=true); out.textContent='Выполняю…';
  try {
    const r=await fetch('/api/terminal/exec',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({command})});
    const data=await r.json(); out.textContent=data.output || data.error || ('HTTP '+r.status);
  } catch(e) { out.textContent='Ошибка соединения: '+e.message; }
  finally { document.querySelectorAll('button').forEach(x=>x.disabled=false); }
}
</script>
</body>
</html>
